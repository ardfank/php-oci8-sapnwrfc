name: Docker Image CI
on:
  # push:
  #   branches: [ "php84","php74" ]
  # pull_request:
  #   branches: [ "php84","php74" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}:${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to DOCKERHUB
      uses: docker/login-action@v3
      with:
        username: "entaahlaah"
        password: ${{ secrets.DOCKERHUBTOKEN }}
    - name: Generate date
      id: build_date
      run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ env.IMAGE_NAME }}
          entaahlaah/php74-oci8-sapnwrfc:${{ github.ref_name }}
        labels: |
          org.opencontainers.image.created=${{ steps.build_date.outputs.DATE }}
          org.opencontainers.image.authors=EntaahLaah
        cache-from: type=gha
        cache-to: type=gha,mode=max
