name: Docker Image CI
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}:${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to DOCKERHUB
      uses: docker/login-action@v3
      with:
        username: "entaahlaah"
        password: ${{ secrets.DOCKERHUBTOKEN }}
    - name: Generate ENV
      id: date
      run: |
        echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        BASE_IMAGE="7.4.33-trixie"
        PHP_VERSION="7.4.33-trixie"
        echo "BASE_IMAGE=$BASE_IMAGE" >> $GITHUB_OUTPUT
        echo "PHP_VERSION=$PHP_VERSION" >> $GITHUB_OUTPUT
        cat >dockerenv<<EOF
        FROM debian:trixie-slim
        RUN apt-get update; apt-get install -y --no-install-recommends ca-certificates curl
        RUN NGINX=\$(curl -fsSL https://nginx.org/packages/debian/pool/nginx/n/nginx/ \
            | grep -oP "nginx_\K[0-9]+\.[0-9]+\.[0-9]+(?=-1~\$(. /etc/os-release && echo "\$VERSION_CODENAME")_amd64\.deb)" \
            | sort -Vu | tail -1) && echo "NGINX_VERSION=\${NGINX}" >> env.txt
        EOF
        cat dockerenv
        docker build -f dockerenv -t temp .
        docker run --rm temp cat env.txt >> $GITHUB_OUTPUT
    - name: Check ENV
      run: |
        echo "DATE: ${{ steps.date.outputs.DATE }}"
        echo "BASE IMAGE: ${{ steps.date.outputs.BASE_IMAGE }}"
        echo "PHP VERSION: ${{ steps.date.outputs.PHP_VERSION }}"
        echo "NGINX VERSION: ${{ steps.date.outputs.NGINX_VERSION }}"
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ env.IMAGE_NAME }}
          ghcr.io/${{ github.repository }}:${{ steps.date.outputs.PHP_VERSION }}
          entaahlaah/php74-oci8-sapnwrfc:${{ github.ref_name }}
          entaahlaah/php74-oci8-sapnwrfc:${{ steps.date.outputs.PHP_VERSION }}
        labels: |
          org.opencontainers.image.authors=EntaahLaah
          php.version=${{ steps.date.outputs.PHP_VERSION }}
          nginx.version=${{ steps.date.outputs.NGINX_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
